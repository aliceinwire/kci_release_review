name: Release review Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-review-pages.yml
      - comparisons.json
      - release-watch.json
      - kci_release_review/**
      - requirements.txt
      - tests/**
  pull_request:
    paths:
      - .github/workflows/release-review-pages.yml
      - comparisons.json
      - release-watch.json
      - kci_release_review/**
      - requirements.txt
      - tests/**
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

# The comparison process only needs to read the checked-out repository.
permissions:
  contents: read

# Serialize builds and deployments without cancelling an in-flight deployment.
# Pull-request checks have independent concurrency groups.
concurrency:
  group: release-review-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the pinned kci-dev API
        run: python -m pip install -r requirements.txt

      - name: Run offline tests
        run: python -m unittest discover -s tests -v

      - name: Validate comparison configuration without network requests
        run: python -m kci_release_review.daily --check --manual-config comparisons.json

      - name: Read the current Pages URL
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Discover releases, retry pending comparisons and build the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python -m kci_release_review.daily \
            --config release-watch.json \
            --manual-config comparisons.json \
            --site-url "$PAGES_URL" \
            --out _site

      - name: Upload the complete Pages site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
          retention-days: 14

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy comparisons
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
